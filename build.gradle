plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'

	id 'com.diffplug.spotless' version '6.25.0'
}


group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'back-end for picknwhip'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	runtimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

spotless {
	java {
		// Google Java Format 적용
		googleJavaFormat()

		// 아래 설정은 선택사항입니다 (사용하지 않는 import 제거 등)
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}


tasks.register('updateGitHooks', Copy) {
	from new File(rootProject.rootDir, '.github/scripts/pre-commit')

	into { new File(rootProject.rootDir, '.git/scripts') }

	fileMode 0775
}

tasks.named('compileJava') {
	dependsOn 'spotlessApply'  // 컴파일 시 포맷팅 자동 적용
	dependsOn 'updateGitHooks' // 컴파일 시 훅 파일 최신화
}
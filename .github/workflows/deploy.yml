name: Deploy to EC2

on:
  push:
    branches:
      - release     # release 브랜치에 푸시되면 실행
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 빌드
      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      # 5. 빌드된 jar 파일을 EC2로 전송 (SCP)
      - name: Copy Jar to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      # 6. EC2 접속해서 서버 재시작 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 실행 중인 Spring Boot 프로세스 찾아서 종료 (없으면 패스)
            sudo fuser -k 8080/tcp || true
            
            # 기존 nohup.out 로그 삭제 
            rm -f nohup.out

            # 새 서버 실행 
            nohup java -jar \
              -Dspring.datasource.url=${{ secrets.DB_URL }} \
              -Dspring.datasource.username=admin \
              -Dspring.datasource.password=${{ secrets.DB_PASSWORD }} \
              -Dspring.jpa.hibernate.ddl-auto=update \
              -Daws.region=ap-northeast-2 \
              -Daws.s3.bucket=${{ secrets.S3_BUCKET }} \
              /home/ubuntu/app/*.jar > nohup.out 2>&1 &
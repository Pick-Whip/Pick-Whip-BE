app:
  frontend-url: ${FRONTEND_URL:https://pick-whip.vercel.app}
  cookie-domain: ${COOKIE_DOMAIN:.picknwhip.shop}

spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "https://www.picknwhip.shop/login/oauth2/code/kakao"
            scope: account_email
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/seed/local # 추후 dev로 변경

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100

  application:
    name: picknwhip_be

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity: 3600000 # 1시간 (단위: ms)
  refresh-token-validity: 1209600000 # 14일 (단위: ms)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET}

kakao:
  admin-key: ${KAKAO_ADMIN_KEY}

logging:
  level:
    root: INFO
    com.example.picknwhip_be: INFO
